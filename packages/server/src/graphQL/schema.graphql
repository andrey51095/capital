type Query {
  moneyBundles: [MoneyBundle!]!
  moneySummary: [MoneySummary!]! @deprecated
  moneySummaryV2: MoneySummaryV2Result!
  currencies: [String!]!
  types: [OptionType!]!
  currencyEquivalent(
    currency: String!
    config: [CurrencyEquivalentConfig!]!
  ): Float!
  feed(page: Int!, perPage: Int!): FeedResult!
  getExpenses(filter: ExpenseFilter): [Expense!]!
  getIncomes(filter: IncomeFilterInput): [Income!]!
}

type Mutation {
  createMoneyBundle(
    currency: String!
    amount: Int!
    description: String
    storage: String!
    type: String!
  ): MoneyBundle!
  updateMoneyBundle(
    id: ID!
    currency: String
    amount: Int
    description: String
    storage: String
    type: String
    transfer: [TransferMoneyBundle!]
  ): MoneyBundle!
  deleteMoneyBundle(id: ID!): MoneyBundle!
  backup: String!
  populate(data: String!): Boolean!
  createExpense(input: ExpenseInput!): Expense!
  deleteExpense(id: ID!): Boolean!
  addIncome(input: AddIncomeInput!): Income!
  deleteIncome(id: ID!): Boolean!
  registerUser(input: RegisterUserInput!): User!
}

type User {
    id: ID!
    username: String!
  }

  input RegisterUserInput {
    username: String!
    password: String!
  }
  
type Income {
    id: ID!
    date: String!
    amount: Float!
    category: String!
    description: String
  }

  input IncomeFilterInput {
    fromDate: String
    toDate: String
    categories: [String]
  }

  input AddIncomeInput {
    date: String!
    amount: Float!
    category: String!
    description: String
  }

type MoneyBundle {
  id: ID!
  currency: String!
  amount: Int!
  description: String
  storage: String!
  type: String!
  createdAt: Float!
  updatedAt: Float!
  deletedAt: Float!
}

input TransferMoneyBundle {
  id: ID
  currency: String!
  amount: Int!
  description: String
  storage: String!
  type: String!
}

type MoneySummary {
  currency: String!
  amount: Int!
}

type MoneySummaryV2Result {
  total: [MoneySummary!]!
  notInvested: [MoneySummary!]!
  invested: [MoneySummary!]!
}

input CurrencyEquivalentConfig {
  currency: String!
  exchangeRate: Float!
}

type OptionType {
  id: ID!
  label: String!
}

type FeedResult {
  page: Int!
  feeds: [Feed!]!
}

type Feed {
  id: ID!
  from: String
  to: String
  transferredTo: String
  createdAt: Float!
}

type Expense {
  id: ID!
  date: String!
  category: String!
  amount: Float!
  description: String
}

input ExpenseFilter {
  startDate: String
  endDate: String
  categories: [String]
}

input ExpenseInput {
  date: String!
  category: String!
  amount: Float!
  description: String
}
